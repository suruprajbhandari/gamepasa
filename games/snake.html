<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="games.css">
    <style>
        .game-container {
            width: 400px;
            height: 400px;
            position: relative;
            margin: 20px auto;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
            font-size: 14px;
        }

        .back-button:hover {
            background-color: #cc0000;
        }

        #game-board {
            width: 100%;
            height: 100%;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        .snake-segment {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #00ff00;
            border: 1px solid #000;
        }

        .food {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff0000;
            border-radius: 50%;
        }

        .score {
            position: absolute;
            top: -40px;
            left: 0;
            color: #fff;
            font-size: 20px;
        }

        .controls {
            position: absolute;
            bottom: -60px;
            left: 0;
            color: #fff;
            font-size: 14px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 24px;
            display: none;
        }

        .restart-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .restart-btn:hover {
            background-color: #cc0000;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #181a1b;
            color: #ccc;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <a href="../Library.html" class="back-button">← Back to Library</a>
    <div class="game-container">
        <div class="score">Score: 0</div>
        <div id="game-board"></div>
        <div class="game-over">Game Over!</div>
        <button class="restart-btn">Restart</button>
        <div class="controls">
            Use arrow keys to control the snake
        </div>
    </div>
    <footer>
        <p>© 2025 GamePasa. All rights reserved.</p>
    </footer>

    <script>
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.querySelector('.score');
        const gameOverDisplay = document.querySelector('.game-over');
        const restartBtn = document.querySelector('.restart-btn');

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let gameSpeed = 200;

        function createFood() {
            const foodElement = document.createElement('div');
            foodElement.className = 'food';
            foodElement.style.left = food.x * 20 + 'px';
            foodElement.style.top = food.y * 20 + 'px';
            gameBoard.appendChild(foodElement);
        }

        function createSnake() {
            snake.forEach((segment, index) => {
                const segmentElement = document.createElement('div');
                segmentElement.className = 'snake-segment';
                segmentElement.style.left = segment.x * 20 + 'px';
                segmentElement.style.top = segment.y * 20 + 'px';
                gameBoard.appendChild(segmentElement);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = 'Score: ' + score;
                food = {
                    x: Math.floor(Math.random() * 20),
                    y: Math.floor(Math.random() * 20)
                };
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                gameOver();
                return;
            }

            gameBoard.innerHTML = '';
            createFood();
            createSnake();
        }

        function gameOver() {
            clearInterval(gameLoop);
            gameOverDisplay.style.display = 'block';
            restartBtn.style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            dx = 0;
            dy = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverDisplay.style.display = 'none';
            restartBtn.style.display = 'none';
            gameBoard.innerHTML = '';
            createFood();
            createSnake();
            gameLoop = setInterval(moveSnake, gameSpeed);
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        restartBtn.addEventListener('click', startGame);

        startGame();
    </script>
</body>
</html>
